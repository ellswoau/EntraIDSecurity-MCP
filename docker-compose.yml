# Entra ID MCP server — Docker Compose (network daemon mode).
#
# This composes the server as a long-running HTTP/SSE daemon so an MCP client
# can reach it over the network. For the embedded/stdio pattern see the README
# "Run via Docker (stdio)" section instead.
#
# Credentials come from ~/.openclaw/entraid-mcp.env (chmod 0600) via
# `env_file`, never inline flags.

services:
  entraid-mcp:
    build: .
    image: entraid-mcp:latest
    container_name: entraid-mcp
    restart: unless-stopped
    command: ["--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # Host 8008 (8000-8007 are taken by the other house daemons).
      - "8008:8000"
    env_file:
      - ${HOME}/.openclaw/entraid-mcp.env
    environment:
      ENTRAID_VERIFY_SSL: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=6).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s